<!DOCTYPE html>
<html>
<head>
    <title>dash.js con estadísticas</title>
    <style>
        video {
            width: 1280px;
            height: 720px;
        }
        #stats, #bitrateDisplay {
            font-family: monospace;
            margin-top: 10px;
            white-space: pre-wrap;
            background-color: #f0f0f0;
            padding: 10px;
            width: 80%;
        }
        #bitrateDisplay {
            background-color: #dff0d8;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <script src="C:/TFG/dash.js/dist/modern/umd/dash.all.min.js"></script>

    <h1>DASH.js Player</h1>
    <video id="videoPlayer" controls autoplay muted></video>
    <br>
    <button onclick="player.play()">▶ Reproducir</button>
    <button id="descargarLog">💾 Descargar log de calidad</button>

    <div id="bitrateDisplay">📶 Bitrate actual: --</div>

    <script>
        const video = document.getElementById("videoPlayer");
        const url = "http://192.168.56.1:1234/Server/manifest.mpd";
        const player = dashjs.MediaPlayer().create();
        const logs = [];
        const bitrateDisplay = document.getElementById("bitrateDisplay");

        player.initialize(video, url, true);

        window.onload = () => {
            video.muted = true;
            video.play().catch(e => console.warn("Autoplay falló:", e));
        };

        player.updateSettings({
            streaming: {
                buffer: {
                    fastSwitchEnabled: false,
                    bufferTimeDefault: 36,
                    bufferTimeAtTopQuality: 42,
                    bufferTimeAtTopQualityLongForm: 42,
                    longFormContentDurationThreshold: 220
                },
                abr: {
                    autoSwitchBitrate: {
                        video: true,
                        audio: false
                    },
                    initialBitrate: {
                        video: -1,
                        audio: -1
                    },
                    maxBitrate: {
                        video: -1,
                        audio: -1
                    },
                    minBitrate: {
                        video: 50,
                        audio: -1
                    },
                    rules: {
                        throughputRule: { active: true },
                        bolaRule: { active: true },
                        insufficientBufferRule: {
                            active: true,
                            parameters: {
                                throughputSafetyFactor: 0.7,
                                segmentIgnoreCount: 1
                            }
                        },
                        switchHistoryRule: {
                            active: true,
                            parameters: {
                                sampleSize: 5,
                                switchPercentageThreshold: 0.2
                            }
                        },
                        droppedFramesRule: {
                            active: true,
                            parameters: {
                                minimumSampleSize: 50,
                                droppedFramesPercentageThreshold: 0.05
                            }
                        },
                        abandonRequestsRule: {
                            active: true,
                            parameters: {
                                abandonDurationMultiplier: 0.9,
                                minSegmentDownloadTimeThresholdInMs: 200,
                                minThroughputSamplesThreshold: 1
                            }
                        },
                        l2ARule: { active: false },
                        loLPRule: { active: false }
                    }
                }
            }
        });

		let inicioRegistrado = false;

		video.addEventListener("playing", () => {
			if (!inicioRegistrado) {
				const now = new Date().toISOString();
				const log = `Reproducción INICIADA a las ${now}`;
				console.log(log);
				logs.push(log);
				inicioRegistrado = true;
			}
		});

		// Detectar final de reproducción
		player.on(dashjs.MediaPlayer.events.PLAYBACK_ENDED, () => {
			const now = new Date().toISOString();
			const log = `Reproducción FINALIZADA a las ${now}`;
			console.log(log);
			logs.push(log);  // También una línea individual
		});

        document.getElementById("descargarLog").addEventListener("click", function () {
            const blob = new Blob([logs.join("\n")], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "tiempos.txt";
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
